<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂 13 October</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6ec;--ink:#3a1f24;--soft:#7a5a5e;--coral:#e8503a;--gold:#e3b23c;--rose:#b8475a;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241216;--ink:#fbe9de;--soft:#c9a9ab;--card:#33191f;--coral:#ff6a52;--gold:#f0c24f;--rose:#e07088;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241216;--ink:#fbe9de;--soft:#c9a9ab;--card:#33191f;--coral:#ff6a52;--gold:#f0c24f;--rose:#e07088;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 'DM Sans',system-ui,sans-serif;overflow-x:hidden}
h1,h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.05;margin:0}
.bunting{display:flex;justify-content:center;gap:6px;padding:18px 8px 0;flex-wrap:wrap}
.bunting .row{display:flex;gap:6px}
.flag{width:clamp(30px,8.6vw,52px);aspect-ratio:3/4;background:var(--coral);color:var(--gold);display:grid;place-items:center;
font:800 clamp(18px,5vw,30px) 'Bricolage Grotesque',sans-serif;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);padding-bottom:10px;transform-origin:top;animation:sway 4s ease-in-out infinite}
.flag:nth-child(even){animation-delay:-2s}
@keyframes sway{50%{transform:rotate(4deg)}}
.hero{text-align:center;padding:36px 22px 20px;max-width:640px;margin:auto}
.hero h1{font-size:clamp(44px,13vw,92px);font-weight:800;color:var(--rose)}
.date{display:inline-block;margin-top:18px;padding:8px 20px;border-radius:999px;background:var(--gold);color:#3a1f24;font-weight:500}
.hero p{color:var(--soft);margin:18px auto 0;max-width:30ch}
.cake{text-align:center;padding:26px 22px}
.cakebtn{background:none;border:0;cursor:pointer;color:inherit;font:inherit}
.cakebtn svg{width:170px;height:auto;display:block;margin:auto}
.cakebtn:focus-visible{outline:3px solid var(--gold);outline-offset:6px;border-radius:12px}
.flame{transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.12,.92)}}
